<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMC Finance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* ── TOKENS ── */
  :root {
    --bg:        #0F1117;
    --surface:   #181C27;
    --surface2:  #1E2335;
    --border:    #2A3050;
    --accent:    #3B82F6;
    --accent2:   #10B981;
    --accent3:   #F59E0B;
    --danger:    #EF4444;
    --text:      #E8EAF0;
    --muted:     #6B7694;
    --label:     #9AA3C2;
    --font-data: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    --font-ui:   'Inter', system-ui, -apple-system, sans-serif;
    --radius:    8px;
    --radius-lg: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
    display: flex;
    min-height: 100vh;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    height: 100vh;
    top: 0; left: 0;
    z-index: 100;
  }

  .logo {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .logo-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .3px;
    color: var(--text);
  }
  .logo-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  nav { flex: 1; padding: 10px 0; overflow-y: auto; }

  .nav-label {
    font-size: 9px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 12px 18px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    cursor: pointer;
    color: var(--label);
    border-left: 3px solid transparent;
    transition: all .15s;
    font-size: 13px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: rgba(59,130,246,.08);
  }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; }

  .sidebar-footer {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
  }
  #last-refresh { color: var(--label); }

  /* ── MAIN ── */
  #main {
    margin-left: 220px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── TOPBAR ── */
  #topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  #page-title {
    font-size: 15px;
    font-weight: 600;
    margin-right: auto;
    color: var(--text);
  }

  select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-size: 12px;
    font-family: var(--font-ui);
    cursor: pointer;
    outline: none;
    min-width: 100px;
  }
  select:focus { border-color: var(--accent); }

  .filter-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .filter-group { display: flex; align-items: center; gap: 6px; }

  /* ── CONTENT ── */
  #content {
    padding: 24px;
    flex: 1;
  }

  /* ── LOADING / ERROR ── */
  .state-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    gap: 12px;
    color: var(--muted);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── KPI CARDS ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .kpi-card.blue::before  { background: var(--accent); }
  .kpi-card.green::before { background: var(--accent2); }
  .kpi-card.amber::before { background: var(--accent3); }
  .kpi-card.red::before   { background: var(--danger); }

  .kpi-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .kpi-value {
    font-family: var(--font-data);
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.5px;
  }
  .kpi-value.negative { color: var(--danger); }
  .kpi-value.positive { color: var(--accent2); }
  .kpi-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── CHART CARDS ── */
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
  }
  .chart-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--label);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 16px;
  }
  .chart-wrap { position: relative; height: 240px; }

  /* ── TABEL ── */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .table-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .table-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--label);
    text-transform: uppercase;
    letter-spacing: .8px;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .data-table th {
    background: var(--surface2);
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .8px;
    padding: 9px 14px;
    text-align: right;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  .data-table th:first-child { text-align: left; }
  .data-table td {
    padding: 8px 14px;
    text-align: right;
    border-bottom: 1px solid rgba(42,48,80,.6);
    font-family: var(--font-data);
    font-size: 11px;
    color: var(--label);
    white-space: nowrap;
  }
  .data-table td:first-child {
    text-align: left;
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--text);
    max-width: 260px;
  }
  .data-table tr:hover td { background: rgba(255,255,255,.02); }
  .data-table tr.total-row td {
    font-weight: 700;
    color: var(--text);
    background: var(--surface2);
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  .data-table tr.section-row td {
    background: rgba(42,48,80,.3);
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    padding: 6px 14px;
  }
  .num-pos { color: var(--accent2) !important; }
  .num-neg { color: var(--danger) !important; }

  .table-scroll { overflow-x: auto; max-height: 480px; overflow-y: auto; }

  /* ── TOGGLE ── */
  .toggle-group {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px;
    gap: 2px;
  }
  .toggle-btn {
    padding: 5px 14px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    color: var(--muted);
    border: none;
    background: none;
    font-family: var(--font-ui);
    transition: all .15s;
  }
  .toggle-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* ── BADGE ── */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
  }
  .badge-green { background: rgba(16,185,129,.15); color: var(--accent2); }
  .badge-red   { background: rgba(239,68,68,.15);  color: var(--danger); }

  /* ── LOGIN OVERLAY ── */
  #login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px 40px;
    width: 360px;
  }
  .login-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .login-sub {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 24px;
  }
  .login-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .login-field label { font-size: 11px; color: var(--label); font-weight: 500; }
  .login-field input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: var(--font-ui);
    outline: none;
    width: 100%;
  }
  .login-field input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-ui);
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .85; }
  #login-error { color: var(--danger); font-size: 11px; margin-top: 10px; display: none; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    #sidebar { width: 100%; height: auto; position: relative; flex-direction: row; }
    #main { margin-left: 0; }
    .chart-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="login-overlay">
  <div class="login-card">
    <div class="login-title">WMC Finance</div>
    <div class="login-sub">Masukkan token akses untuk melanjutkan</div>
    <div class="login-field">
      <label>API Endpoint (Apps Script URL)</label>
      <input type="text" id="inp-url" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="login-field">
      <label>Token Akses</label>
      <input type="password" id="inp-token" placeholder="••••••••••••••••">
    </div>
    <button class="btn-primary" onclick="doLogin()">Masuk</button>
    <div id="login-error">Token atau URL tidak valid. Coba lagi.</div>
  </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="logo">
    <div class="logo-name">WM Center</div>
    <div class="logo-sub">Finance Dashboard</div>
  </div>
  <nav>
    <div class="nav-label">Menu</div>
    <div class="nav-item active" data-page="overview" onclick="navigate(this)">
      <span class="nav-icon">◈</span> Overview
    </div>
    <div class="nav-item" data-page="laba_rugi_pt" onclick="navigate(this)">
      <span class="nav-icon">▤</span> Laba Rugi PT
    </div>
    <div class="nav-item" data-page="laba_rugi_cabang" onclick="navigate(this)">
      <span class="nav-icon">▤</span> Laba Rugi Cabang
    </div>
    <div class="nav-item" data-page="cashflow" onclick="navigate(this)">
      <span class="nav-icon">⇄</span> Cashflow
    </div>
  </nav>
  <div class="sidebar-footer">
    Auto-refresh 5 menit<br>
    <span id="last-refresh">—</span>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <span id="page-title">Overview</span>

    <div class="filter-group">
      <span class="filter-label">Bulan</span>
      <select id="filter-bulan" onchange="onFilterChange()">
        <option value="">Memuat...</option>
      </select>
    </div>

    <div class="filter-group" id="filter-pt-group">
      <span class="filter-label">PT</span>
      <select id="filter-pt" onchange="onFilterChange()">
        <option value="">Semua PT</option>
      </select>
    </div>

    <div class="filter-group" id="filter-cabang-group" style="display:none">
      <span class="filter-label">Cabang</span>
      <select id="filter-cabang" onchange="onFilterChange()">
        <option value="">Semua Cabang</option>
      </select>
    </div>
  </div>

  <div id="content">
    <div class="state-box"><div class="spinner"></div><span>Memuat data...</span></div>
  </div>
</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────
const LS_URL   = 'wmc_api_url';
const LS_TOKEN = 'wmc_api_token';

let API_URL   = '';
let API_TOKEN = '';
let currentPage = 'overview';
let currentData = {};
let refreshTimer = null;
let overviewMode = 'compare_pt'; // atau 'compare_month'
const CORE_PT = ['WMC','WMU','WMH','WMS','WMP','WMB','WMA','WMII','WMI'];

// ── FORMAT ANGKA ─────────────────────────────────────────────
function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const abs = Math.abs(n);
  let s;
  if (abs >= 1_000_000_000)      s = (n / 1_000_000_000).toFixed(1).replace('.', ',') + ' bn';
  else if (abs >= 1_000_000)     s = (n / 1_000_000).toFixed(1).replace('.', ',') + ' mn';
  else if (abs >= 1_000)         s = (n / 1_000).toFixed(0) + ' K';
  else                           s = n.toLocaleString('id');
  return s;
}

function fmtClass(n) {
  if (!n || n === 0) return '';
  return n > 0 ? 'num-pos' : 'num-neg';
}

// ── LOGIN ────────────────────────────────────────────────────
async function doLogin() {
  const url   = document.getElementById('inp-url').value.trim();
  const token = document.getElementById('inp-token').value.trim();
  if (!url || !token) return;

  try {
    const res = await fetch(`${url}?token=${token}&action=sheets`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    API_URL   = url;
    API_TOKEN = token;
    // Simpan di sessionStorage (bukan localStorage agar lebih aman)
    sessionStorage.setItem(LS_URL,   url);
    sessionStorage.setItem(LS_TOKEN, token);

    document.getElementById('login-overlay').style.display = 'none';
    initDashboard(data.months);
  } catch(e) {
    document.getElementById('login-error').style.display = 'block';
  }
}

// Auto-login dari session
window.addEventListener('DOMContentLoaded', () => {
  const url   = sessionStorage.getItem(LS_URL);
  const token = sessionStorage.getItem(LS_TOKEN);
  if (url && token) {
    document.getElementById('inp-url').value   = url;
    document.getElementById('inp-token').value = token;
    API_URL   = url;
    API_TOKEN = token;
    fetchMonths().then(months => {
      if (months) {
        document.getElementById('login-overlay').style.display = 'none';
        initDashboard(months);
      }
    });
  }
});

// ── INIT ─────────────────────────────────────────────────────
async function fetchMonths() {
  try {
    const res  = await apiFetch('sheets');
    return res.months || [];
  } catch { return null; }
}

function initDashboard(months) {
  const sel = document.getElementById('filter-bulan');
  sel.innerHTML = '';
  months.forEach((m, i) => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    if (i === months.length - 1) opt.selected = true; // default: bulan terbaru
    sel.appendChild(opt);
  });
  loadPage();
  startAutoRefresh();
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadPage, 5 * 60 * 1000); // 5 menit
}

// ── NAVIGASI ─────────────────────────────────────────────────
function navigate(el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  currentPage = el.dataset.page;

  const titles = {
    overview:         'Overview',
    laba_rugi_pt:     'Laba Rugi — Per PT',
    laba_rugi_cabang: 'Laba Rugi — Per Cabang',
    cashflow:         'Cashflow',
  };
  document.getElementById('page-title').textContent = titles[currentPage] || currentPage;

  // Show/hide filter cabang
  document.getElementById('filter-cabang-group').style.display =
    currentPage === 'laba_rugi_cabang' ? 'flex' : 'none';
  document.getElementById('filter-pt-group').style.display =
    currentPage === 'laba_rugi_cabang' ? 'none' : 'flex';

  loadPage();
}

function onFilterChange() { loadPage(); }

// ── API FETCH ────────────────────────────────────────────────
async function apiFetch(action, params = {}) {
  const qp = new URLSearchParams({ token: API_TOKEN, action, ...params });
  const res = await fetch(`${API_URL}?${qp}`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ── LOAD PAGE ────────────────────────────────────────────────
async function loadPage() {
  const bulan = document.getElementById('filter-bulan').value;
  showLoading();
  try {
    if (currentPage === 'overview') {
      const data = await apiFetch('overview', { bulan });
      currentData = data;
      renderOverview(data);
    } else if (currentPage === 'laba_rugi_pt') {
      const data = await apiFetch('laba_rugi_pt', { bulan });
      currentData = data;
      populatePTFilter(data.entities);
      renderLabaRugiPT(data);
    } else if (currentPage === 'laba_rugi_cabang') {
      const data = await apiFetch('laba_rugi_cabang', { bulan });
      currentData = data;
      populateCabangFilter(data.cabang);
      renderLabaRugiCabang(data);
    } else if (currentPage === 'cashflow') {
      const data = await apiFetch('cashflow', { bulan });
      currentData = data;
      renderCashflow(data);
    }
    document.getElementById('last-refresh').textContent =
      'Diperbarui ' + new Date().toLocaleTimeString('id');
  } catch(e) {
    showError(e.message);
  }
}

function showLoading() {
  document.getElementById('content').innerHTML =
    `<div class="state-box"><div class="spinner"></div><span>Memuat data...</span></div>`;
}
function showError(msg) {
  document.getElementById('content').innerHTML =
    `<div class="state-box">⚠ Gagal memuat data<br><small style="color:var(--muted)">${msg}</small></div>`;
}

// ── FILTER POPULATE ──────────────────────────────────────────
function populatePTFilter(entities) {
  const corePT = (entities || []).filter(e => CORE_PT.includes(e));
  const sel = document.getElementById('filter-pt');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Semua PT</option>';
  corePT.forEach(pt => {
    const opt = document.createElement('option');
    opt.value = pt; opt.textContent = pt;
    if (pt === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

function populateCabangFilter(cabangList) {
  const sel = document.getElementById('filter-cabang');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Semua Cabang</option>';
  (cabangList || []).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    if (c === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

// ── CHART HELPERS ────────────────────────────────────────────
const CHART_COLORS = [
  '#3B82F6','#10B981','#F59E0B','#8B5CF6',
  '#EC4899','#14B8A6','#F97316','#6366F1','#EF4444'
];
let charts = {};

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function makeBar(canvasId, labels, datasets, opts = {}) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId).getContext('2d');
  charts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#6B7694', font: { size: 10 } } } },
      scales: {
        x: { ticks: { color: '#6B7694', font: { size: 10 } }, grid: { color: '#2A3050' } },
        y: { ticks: { color: '#6B7694', font: { size: 10 },
              callback: v => fmt(v) }, grid: { color: '#2A3050' } }
      },
      ...opts
    }
  });
}

function makeLine(canvasId, labels, datasets) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId).getContext('2d');
  charts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#6B7694', font: { size: 10 } } } },
      scales: {
        x: { ticks: { color: '#6B7694' }, grid: { color: '#2A3050' } },
        y: { ticks: { color: '#6B7694', callback: v => fmt(v) }, grid: { color: '#2A3050' } }
      }
    }
  });
}

// ── RENDER: OVERVIEW ─────────────────────────────────────────
function renderOverview(data) {
  const rows  = data.laba_rugi_pt.all_rows || [];
  const cfRows = data.cashflow.rows || [];
  const bulan = data.bulan;

  // Cari baris ringkasan
  const findRow = (keyword) => rows.find(r =>
    r.nama.toUpperCase().includes(keyword.toUpperCase()));
  const sumByPT = (keyword, entities) => {
    const r = findRow(keyword);
    if (!r) return {};
    const res = {};
    entities.forEach(e => res[e] = r.values[e] || 0);
    return res;
  };

  const corePT = CORE_PT.filter(pt => data.entities_pt && data.entities_pt.includes(pt));

  // KPI: akumulasi dari baris total
  const rowPendapatan = findRow('JUMLAH PENDAPATAN');
  const rowBeban      = rows.filter(r => r.nama.toUpperCase().includes('JUMLAH BEBAN')
                                      || r.nama.toUpperCase().includes('TOTAL BEBAN'));
  const rowLaba       = findRow('LABA');

  const totalPendapatan = rowPendapatan ? rowPendapatan.akumulasi : 0;
  const totalBeban      = rowBeban.reduce((s, r) => s + (r.akumulasi || 0), 0);
  const totalLaba       = rowLaba ? rowLaba.akumulasi : (totalPendapatan + totalBeban);
  const totalCF         = cfRows.reduce((s, r) => s + (r.akumulasi || 0), 0);

  const labaClass = totalLaba >= 0 ? 'positive' : 'negative';

  // Bar chart: Revenue per PT
  const revPerPT = corePT.map(pt => {
    const r = findRow('JUMLAH PENDAPATAN');
    return r ? (r.values[pt] || 0) : 0;
  });

  // Beban per PT (ambil semua baris beban, sum per PT)
  const bebanRows = rows.filter(r =>
    !r.nama.toUpperCase().includes('PENDAPATAN') &&
    !r.nama.toUpperCase().includes('LABA') &&
    !r.nama.toUpperCase().includes('RUGI') &&
    !r.nama.toUpperCase().includes('JUMLAH')
  );
  const bebanPerPT = corePT.map(pt =>
    bebanRows.reduce((s, r) => s + Math.abs(r.values[pt] || 0), 0)
  );

  document.getElementById('content').innerHTML = `
    <!-- KPI -->
    <div class="kpi-grid">
      <div class="kpi-card blue">
        <div class="kpi-label">Total Pendapatan</div>
        <div class="kpi-value">${fmt(totalPendapatan)}</div>
        <div class="kpi-sub">${bulan}</div>
      </div>
      <div class="kpi-card red">
        <div class="kpi-label">Total Beban</div>
        <div class="kpi-value">${fmt(Math.abs(totalBeban))}</div>
        <div class="kpi-sub">${bulan}</div>
      </div>
      <div class="kpi-card ${totalLaba >= 0 ? 'green' : 'red'}">
        <div class="kpi-label">Laba / Rugi</div>
        <div class="kpi-value ${labaClass}">${fmt(totalLaba)}</div>
        <div class="kpi-sub">${bulan}</div>
      </div>
      <div class="kpi-card amber">
        <div class="kpi-label">Cashflow (Konsolidasi)</div>
        <div class="kpi-value">${fmt(totalCF)}</div>
        <div class="kpi-sub">${bulan} — semua entitas</div>
      </div>
    </div>

    <!-- Toggle mode -->
    <div style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <span style="font-size:11px;color:var(--muted)">Tampilan</span>
      <div class="toggle-group">
        <button class="toggle-btn ${overviewMode==='compare_pt'?'active':''}"
          onclick="setOverviewMode('compare_pt')">Bandingkan PT</button>
        <button class="toggle-btn ${overviewMode==='compare_month'?'active':''}"
          onclick="setOverviewMode('compare_month')">Tren Bulanan</button>
      </div>
    </div>

    <!-- Charts -->
    <div class="chart-grid">
      <div class="chart-card">
        <div class="chart-title">Revenue per PT</div>
        <div class="chart-wrap"><canvas id="ch-rev"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Beban Operasional per PT</div>
        <div class="chart-wrap"><canvas id="ch-beban"></canvas></div>
      </div>
    </div>

    <!-- Laba per PT mini table -->
    <div class="table-card">
      <div class="table-header">
        <span class="table-title">Ringkasan per PT — ${bulan}</span>
      </div>
      <div class="table-scroll">
        <table class="data-table" id="tbl-overview"></table>
      </div>
    </div>
  `;

  // Bar charts
  makeBar('ch-rev', corePT, [{
    label: 'Pendapatan',
    data: revPerPT,
    backgroundColor: CHART_COLORS[0] + 'CC',
    borderColor: CHART_COLORS[0],
    borderWidth: 1,
  }]);

  makeBar('ch-beban', corePT, [{
    label: 'Total Beban',
    data: bebanPerPT,
    backgroundColor: CHART_COLORS[3] + 'CC',
    borderColor: CHART_COLORS[3],
    borderWidth: 1,
  }]);

  // Tabel ringkasan per PT
  const tbl = document.getElementById('tbl-overview');
  let html = '<thead><tr><th>PT</th><th>Pendapatan</th><th>Beban</th><th>Laba/Rugi</th></tr></thead><tbody>';
  corePT.forEach(pt => {
    const rev  = rowPendapatan ? (rowPendapatan.values[pt] || 0) : 0;
    const beb  = bebanRows.reduce((s, r) => s + (r.values[pt] || 0), 0);
    const laba = rev + beb;
    html += `<tr>
      <td><strong>${pt}</strong></td>
      <td class="${fmtClass(rev)}">${fmt(rev)}</td>
      <td class="${fmtClass(beb)}">${fmt(beb)}</td>
      <td class="${fmtClass(laba)}">${fmt(laba)}</td>
    </tr>`;
  });
  html += '</tbody>';
  tbl.innerHTML = html;
}

function setOverviewMode(mode) {
  overviewMode = mode;
  if (currentData && currentPage === 'overview') renderOverview(currentData);
}

// ── RENDER: LABA RUGI PT ─────────────────────────────────────
function renderLabaRugiPT(data) {
  const filterPT = document.getElementById('filter-pt').value;
  const bulan    = document.getElementById('filter-bulan').value;

  // Entitas yang ditampilkan
  const corePT  = data.entities.filter(e => CORE_PT.includes(e));
  const showPTs = filterPT ? [filterPT] : corePT;

  // Rekening (non-PT)
  const rekening = data.entities.filter(e => !CORE_PT.includes(e));

  // Pisahkan baris berdasarkan kategori
  const sectionMap = {
    'Pendapatan': [],
    'Sales Expense': [],
    'Depresiasi & Amortisasi': [],
    'Gaji & Benefit': [],
    'G&A Lainnya': [],
    'RAB': [],
    'Repair & Maintenance': [],
  };

  data.rows.forEach(r => {
    const n = r.nama.toUpperCase();
    if (n.includes('JUMLAH') || n.includes('TOTAL') || n.includes('LABA') || n.includes('RUGI')) {
      // handled separately
    } else if (n.includes('DISKON') || n.includes('REFUND') || n.includes('SETTLEMENT')
            || n.includes('MDR') || n.includes('PENJUALAN') || n.includes('PENDAPATAN')) {
      sectionMap['Pendapatan'].push(r);
    } else if (n.includes('PROMOSI') || n.includes('MARKETING') || n.includes('IKLAN')
            || n.includes('ENTERTAIN')) {
      sectionMap['Sales Expense'].push(r);
    } else if (n.includes('DEPRESIASI') || n.includes('AMORTISASI') || n.includes('PENYUSUTAN')) {
      sectionMap['Depresiasi & Amortisasi'].push(r);
    } else if (n.includes('GAJI') || n.includes('UPAH') || n.includes('BPJS')
            || n.includes('THR') || n.includes('BONUS') || n.includes('VOLUNTEER')
            || n.includes('KARYAWAN')) {
      sectionMap['Gaji & Benefit'].push(r);
    } else if (n.includes('RAB')) {
      sectionMap['RAB'].push(r);
    } else if (n.includes('PEMELIHARAAN') || n.includes('REPAIR')) {
      sectionMap['Repair & Maintenance'].push(r);
    } else {
      sectionMap['G&A Lainnya'].push(r);
    }
  });

  // Baris total
  const totalRows = data.rows.filter(r => {
    const n = r.nama.toUpperCase();
    return n.includes('JUMLAH') || n.includes('TOTAL') || n.includes('LABA') || n.includes('RUGI');
  });

  // KPI per PT yang dipilih
  const getColSum = (rows, pt) => rows.reduce((s, r) => s + (r.values[pt] || 0), 0);
  const pendRows  = sectionMap['Pendapatan'];
  const totalPend = filterPT
    ? getColSum(pendRows, filterPT)
    : pendRows.reduce((s, r) => s + (r.akumulasi || 0), 0);

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid" id="kpi-lrpt"></div>
    <div class="chart-grid">
      <div class="chart-card">
        <div class="chart-title">Pendapatan vs Beban — ${filterPT || 'Semua PT'}</div>
        <div class="chart-wrap"><canvas id="ch-lrpt-main"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Komposisi Beban</div>
        <div class="chart-wrap"><canvas id="ch-lrpt-pie"></canvas></div>
      </div>
    </div>
    <div class="table-card">
      <div class="table-header">
        <span class="table-title">Detail Laba Rugi — ${bulan}</span>
      </div>
      <div class="table-scroll">
        <table class="data-table" id="tbl-lrpt">
          <thead><tr>
            <th>Nama Akun</th>
            ${showPTs.map(pt => `<th>${pt}</th>`).join('')}
            <th>Akumulasi</th>
          </tr></thead>
          <tbody id="tbody-lrpt"></tbody>
        </table>
      </div>
    </div>
  `;

  // Isi KPI
  const kpiEl = document.getElementById('kpi-lrpt');
  const labaRow = totalRows.find(r => r.nama.toUpperCase().includes('LABA'));
  const pendKPI = filterPT ? getColSum(pendRows, filterPT)
    : pendRows.reduce((s,r) => s + (r.akumulasi||0), 0);
  const bebanAll = [...sectionMap['Gaji & Benefit'], ...sectionMap['G&A Lainnya'],
                    ...sectionMap['RAB'], ...sectionMap['Sales Expense'],
                    ...sectionMap['Depresiasi & Amortisasi'], ...sectionMap['Repair & Maintenance']];
  const bebanKPI = filterPT ? getColSum(bebanAll, filterPT)
    : bebanAll.reduce((s,r) => s + (r.akumulasi||0), 0);
  const labaKPI  = filterPT && labaRow ? (labaRow.values[filterPT] || 0)
    : (labaRow ? labaRow.akumulasi : pendKPI + bebanKPI);

  kpiEl.innerHTML = `
    <div class="kpi-card blue"><div class="kpi-label">Pendapatan</div>
      <div class="kpi-value">${fmt(pendKPI)}</div></div>
    <div class="kpi-card red"><div class="kpi-label">Total Beban</div>
      <div class="kpi-value">${fmt(Math.abs(bebanKPI))}</div></div>
    <div class="kpi-card ${labaKPI >= 0 ? 'green':'red'}">
      <div class="kpi-label">Laba / Rugi</div>
      <div class="kpi-value ${labaKPI >= 0 ? 'positive':'negative'}">${fmt(labaKPI)}</div>
    </div>
  `;

  // Bar chart pendapatan vs beban per PT
  const chartLabels  = showPTs;
  const chartRev     = showPTs.map(pt => getColSum(pendRows, pt));
  const chartBeban   = showPTs.map(pt => Math.abs(getColSum(bebanAll, pt)));
  makeBar('ch-lrpt-main', chartLabels, [
    { label: 'Pendapatan', data: chartRev,   backgroundColor: CHART_COLORS[0]+'BB' },
    { label: 'Beban',      data: chartBeban, backgroundColor: CHART_COLORS[3]+'BB' },
  ]);

  // Pie komposisi beban
  const bebanCats = Object.keys(sectionMap).filter(k => k !== 'Pendapatan');
  const bebanVals = bebanCats.map(cat =>
    Math.abs(sectionMap[cat].reduce((s,r) => {
      return s + (filterPT ? (r.values[filterPT]||0) : (r.akumulasi||0));
    }, 0))
  ).filter((_, i) => bebanVals => true);

  destroyChart('ch-lrpt-pie');
  const ctxPie = document.getElementById('ch-lrpt-pie').getContext('2d');
  charts['ch-lrpt-pie'] = new Chart(ctxPie, {
    type: 'doughnut',
    data: {
      labels: bebanCats,
      datasets: [{ data: bebanCats.map((cat,i) =>
        Math.abs(sectionMap[cat].reduce((s,r) =>
          s + (filterPT ? (r.values[filterPT]||0) : (r.akumulasi||0)), 0)
        )),
        backgroundColor: CHART_COLORS,
        borderColor: '#181C27', borderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right', labels: { color:'#6B7694', font:{size:10}, boxWidth:12 } } }
    }
  });

  // Tabel detail per seksi
  const tbody = document.getElementById('tbody-lrpt');
  let html = '';

  Object.entries(sectionMap).forEach(([section, rows]) => {
    if (!rows.length) return;
    html += `<tr class="section-row"><td colspan="${showPTs.length + 2}">${section}</td></tr>`;
    rows.forEach(r => {
      html += `<tr>
        <td>${r.nama}</td>
        ${showPTs.map(pt => `<td class="${fmtClass(r.values[pt]||0)}">${fmt(r.values[pt]||0)}</td>`).join('')}
        <td class="${fmtClass(r.akumulasi)}">${fmt(r.akumulasi)}</td>
      </tr>`;
    });
  });

  // Total rows
  totalRows.forEach(r => {
    html += `<tr class="total-row">
      <td>${r.nama}</td>
      ${showPTs.map(pt => `<td class="${fmtClass(r.values[pt]||0)}">${fmt(r.values[pt]||0)}</td>`).join('')}
      <td class="${fmtClass(r.akumulasi)}">${fmt(r.akumulasi)}</td>
    </tr>`;
  });

  tbody.innerHTML = html;
}

// ── RENDER: LABA RUGI CABANG ─────────────────────────────────
function renderLabaRugiCabang(data) {
  const filterCab = document.getElementById('filter-cabang').value;
  const bulan     = document.getElementById('filter-bulan').value;
  const showCab   = filterCab ? [filterCab] : data.cabang;

  const totalRows = data.rows.filter(r => {
    const n = r.nama.toUpperCase();
    return n.includes('JUMLAH') || n.includes('TOTAL') || n.includes('LABA') || n.includes('RUGI');
  });
  const dataRows = data.rows.filter(r => {
    const n = r.nama.toUpperCase();
    return !n.includes('JUMLAH') && !n.includes('TOTAL') && !n.includes('LABA') && !n.includes('RUGI');
  });

  // KPI
  const pendRows = dataRows.filter(r => {
    const n = r.nama.toUpperCase();
    return n.includes('PENJUALAN') || n.includes('PENDAPATAN') || n.includes('SETTLEMENT');
  });
  const bebanRows = dataRows.filter(r => !pendRows.includes(r));

  const getColSum = (rows, col) => rows.reduce((s, r) => s + (r.values[col] || 0), 0);
  const pendKPI  = filterCab ? getColSum(pendRows, filterCab)
    : pendRows.reduce((s,r) => s+(r.akumulasi||0), 0);
  const bebanKPI = filterCab ? getColSum(bebanRows, filterCab)
    : bebanRows.reduce((s,r) => s+(r.akumulasi||0), 0);
  const labaRow  = totalRows.find(r => r.nama.toUpperCase().includes('LABA'));
  const labaKPI  = filterCab && labaRow ? (labaRow.values[filterCab]||0)
    : (labaRow ? labaRow.akumulasi : pendKPI + bebanKPI);

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card blue"><div class="kpi-label">Pendapatan</div>
        <div class="kpi-value">${fmt(pendKPI)}</div></div>
      <div class="kpi-card red"><div class="kpi-label">Total Beban</div>
        <div class="kpi-value">${fmt(Math.abs(bebanKPI))}</div></div>
      <div class="kpi-card ${labaKPI>=0?'green':'red'}">
        <div class="kpi-label">Laba / Rugi</div>
        <div class="kpi-value ${labaKPI>=0?'positive':'negative'}">${fmt(labaKPI)}</div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="chart-card">
        <div class="chart-title">Revenue per Cabang</div>
        <div class="chart-wrap"><canvas id="ch-cab-rev"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Laba/Rugi per Cabang</div>
        <div class="chart-wrap"><canvas id="ch-cab-laba"></canvas></div>
      </div>
    </div>
    <div class="table-card">
      <div class="table-header">
        <span class="table-title">Detail per Cabang — ${bulan}</span>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr>
            <th>Nama Akun</th>
            ${showCab.map(c => `<th>${c}</th>`).join('')}
            <th>Akumulasi</th>
          </tr></thead>
          <tbody>
            ${dataRows.map(r => `<tr>
              <td>${r.nama}</td>
              ${showCab.map(c => `<td class="${fmtClass(r.values[c]||0)}">${fmt(r.values[c]||0)}</td>`).join('')}
              <td class="${fmtClass(r.akumulasi)}">${fmt(r.akumulasi)}</td>
            </tr>`).join('')}
            ${totalRows.map(r => `<tr class="total-row">
              <td>${r.nama}</td>
              ${showCab.map(c => `<td class="${fmtClass(r.values[c]||0)}">${fmt(r.values[c]||0)}</td>`).join('')}
              <td class="${fmtClass(r.akumulasi)}">${fmt(r.akumulasi)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Charts
  const revPerCab  = showCab.map(c => getColSum(pendRows, c));
  const labaPerCab = showCab.map(c =>
    labaRow ? (labaRow.values[c]||0) : getColSum(pendRows,c) + getColSum(bebanRows,c)
  );

  makeBar('ch-cab-rev', showCab, [{
    label:'Pendapatan', data: revPerCab, backgroundColor: CHART_COLORS[0]+'BB'
  }]);
  makeBar('ch-cab-laba', showCab, [{
    label:'Laba/Rugi', data: labaPerCab,
    backgroundColor: labaPerCab.map(v => v >= 0 ? CHART_COLORS[1]+'BB' : CHART_COLORS[8]+'BB'),
  }]);
}

// ── RENDER: CASHFLOW ─────────────────────────────────────────
function renderCashflow(data) {
  const bulan   = document.getElementById('filter-bulan').value;
  const columns = data.columns || [];
  const rows    = data.rows || [];

  // Total keseluruhan
  const totalCF = rows.reduce((s, r) => s + (r.akumulasi || 0), 0);

  // Baris total/subtotal
  const totalRows = rows.filter(r => {
    const n = r.nama.toUpperCase();
    return n.includes('TOTAL') || n.includes('JUMLAH') || n.includes('ARUS KAS BERSIH') || n.includes('SALDO');
  });
  const dataRows = rows.filter(r => !totalRows.includes(r));

  // Breakdown per kolom (PT / rekening)
  const colTotals = columns.map(col => ({
    name: col,
    total: rows.reduce((s, r) => s + (r.values[col] || 0), 0)
  }));

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card ${totalCF>=0?'green':'red'}">
        <div class="kpi-label">Total Cashflow</div>
        <div class="kpi-value ${totalCF>=0?'positive':'negative'}">${fmt(totalCF)}</div>
        <div class="kpi-sub">${bulan} — Konsolidasi</div>
      </div>
      ${colTotals.slice(0,3).map((c,i) => `
        <div class="kpi-card ${c.total>=0?'green':'red'}">
          <div class="kpi-label">${c.name}</div>
          <div class="kpi-value ${c.total>=0?'positive':'negative'}">${fmt(c.total)}</div>
        </div>
      `).join('')}
    </div>
    <div class="chart-grid">
      <div class="chart-card" style="grid-column: 1/-1">
        <div class="chart-title">Cashflow per Entitas — ${bulan}</div>
        <div class="chart-wrap" style="height:260px"><canvas id="ch-cf-main"></canvas></div>
      </div>
    </div>
    <div class="table-card">
      <div class="table-header">
        <span class="table-title">Detail Cashflow — ${bulan}</span>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr>
            <th>Keterangan</th>
            ${columns.map(c => `<th>${c}</th>`).join('')}
            <th>Akumulasi</th>
          </tr></thead>
          <tbody>
            ${dataRows.map(r => `<tr>
              <td>${r.nama}</td>
              ${columns.map(c => `<td class="${fmtClass(r.values[c]||0)}">${fmt(r.values[c]||0)}</td>`).join('')}
              <td class="${fmtClass(r.akumulasi)}">${fmt(r.akumulasi)}</td>
            </tr>`).join('')}
            ${totalRows.map(r => `<tr class="total-row">
              <td>${r.nama}</td>
              ${columns.map(c => `<td class="${fmtClass(r.values[c]||0)}">${fmt(r.values[c]||0)}</td>`).join('')}
              <td class="${fmtClass(r.akumulasi)}">${fmt(r.akumulasi)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Bar chart per kolom/entitas
  makeBar('ch-cf-main',
    colTotals.map(c => c.name),
    [{
      label: 'Cashflow',
      data: colTotals.map(c => c.total),
      backgroundColor: colTotals.map(c => c.total >= 0 ? CHART_COLORS[1]+'BB' : CHART_COLORS[8]+'BB'),
      borderColor: colTotals.map(c => c.total >= 0 ? CHART_COLORS[1] : CHART_COLORS[8]),
      borderWidth: 1,
    }]
  );
}
